  <style>
    /* 🔹 ESTILOS BASE */
    body {
      font-family: 'Open Sans', sans-serif; margin: 0; padding: 0;
      background: linear-gradient(135deg, #1f2559, #3b82f6); color: #333; line-height: 1.6; min-height: 100vh;

    .container { max-width: 1200px; margin: 2.5rem auto; padding: 0 1.5rem 3rem; }

    /* 🔹 HEADER */
    .header {
      background: rgba(15, 23, 42, 0.96); color: #f9fafb;
      padding: 1.25rem 1.5rem; border-radius: 18px;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.8rem; box-shadow: 0 18px 45px rgba(15, 23, 42, 0.4);
    }
    .logout-button {
      background: linear-gradient(135deg, #f97373, #ef4444); color: white;
      padding: 0.65rem 1.4rem; border-radius: 999px; text-decoration: none;
      font-weight: 600; cursor: pointer; border: none; transition: 0.3s;
    }

    /* 💼 TARJETA DE CONSULTORÍA (PROYECTO EMPRENDEDOR) */
    .consultoria-banner {
      background: #ffffff; padding: 2rem; border-radius: 20px;
      margin-bottom: 2.5rem; border-left: 8px solid #3b82f6;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    }
    .consultoria-content h2 { margin: 0; color: #1f2559; font-size: 1.6rem; }
    .consultoria-content p { margin: 10px 0 0; color: #4b5563; font-weight: 600; }
    .consultoria-btn {
      background: #1f2559; color: white; padding: 1rem 2rem; border-radius: 12px;
      text-decoration: none; font-weight: 700; transition: 0.3s;
    }
    .consultoria-btn:hover { background: #3b82f6; transform: scale(1.05); }

    .welcome-message {
      background: rgba(248, 250, 252, 0.98); padding: 1.5rem;
      margin-bottom: 1.8rem; border-radius: 16px; border-left: 5px solid #22c55e;
    }

    /* 🔹 GRID DE CURSOS */
.course-grid { 
  display: flex !important;
  flex-wrap: wrap !important;
  gap: 2.5rem !important;
  justify-content: center !important; /* Mantiene todo centrado si hay uno o muchos */
}
.course-card {
  width: 550px !important;
  background: white !important;
  border-radius: 16px;
  overflow: hidden; /* Esto es clave para contener la imagen dentro de los bordes redondeados */

  flex-direction: column !important;

  transition: 0.3s;
}

    /* 🎀 CINTA "GRATIS" (Ahora es un sticker flotante) */

    .course-card:hover { transform: translateY(-10px); }

.course-card-image{
    width:100%;
    display:block;

    /*max-height:180px;    antes 150 */
    /*object-fit:contain;*/
    /*background:#0f172a;*/
    /*padding:5px 0;*/
}

  padding: 1.5rem !important;
  flex-grow: 1;
}
   .course-card-content h3 { 
  font-size: 1.4rem !important; 
  margin-bottom: 10px !important;
  color: #1f2559;
}
    .course-card-button { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; padding: 0.8rem; border-radius: 12px; text-align: center; font-weight: 600; border: none; cursor: pointer; transition: 0.3s; }

    

    #loader { color: white; text-align: center; font-size: 1.2rem; margin-top: 50px; }

    /* 📱 MÓVIL: Aquí "flaqueamos" la imagen para que parezca banner */
/* 📱 OPTIMIZACIÓN MÓVIL FINAL */
@media (max-width: 768px) { 
  .course-card {
    width: 100% !important;
    margin-top: 10px;
  }
  
  .container { 
    width: 100% !important;
    max-width: 100% !important;
    padding: 0 20px 3rem !important;
    margin: 1rem 0 !important;

  }

    display: flex !important;
    flex-direction: column !important;
    gap: 1.5rem !important;
  }

  width: 100% !important;

  object-fit: contain !important;
  display: block !important;

  padding: 5px 0;
}
  /* Ajuste sutil de títulos para acompañar el cambio */

  .course-card-content h3 { font-size: 1.1rem !important; margin-bottom: 8px !important; }

<body>

  <div class="container">
    <header class="header">
      <h1 style="margin:0; font-size: 1.5rem;">Mis Cursos</h1>
      <button class="logout-button" onclick="cerrarSesion()">Cerrar Sesión</button>
    </header>

   <div class="consultoria-banner" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; margin-bottom: 20px; gap: 15px; flex-wrap: wrap;">
    <div class="consultoria-content" style="text-align: left; margin: 0;">
        <h4 style="color: #ffffff; margin: 0; font-size: 1rem; font-weight: 600;">¿Buscas acelerar tus resultados?</h4>
        <p style="color: #cbd5e1; margin: 0; font-size: 0.85rem;">Explora nuestros packs avanzados o agenda una consultoría.</p>
    </div>
    
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <!-- Botón sutil 1: Catálogo -->
        <a href="https://hugo85ar.github.io/catalogo-promociones/" target="_blank" rel="noopener" class="consultoria-btn" style="background-color: #059669; border-color: #059669; padding: 6px 14px; font-size: 0.85rem;">
            🚀 Ver Catálogo
        </a>

        <!-- Botón sutil 2: Consultoría WhatsApp -->
        <a href="#" id="consultoriaBtn" class="consultoria-btn" style="padding: 6px 14px; font-size: 0.85rem;" target="_blank" rel="noopener">
            💬 Asesoría
        </a>
    </div>
</div>

    <section class="welcome-message">
      <h2 id="welcomeText" style="margin:0 0 5px 0;">Cargando...</h2>
      <p style="margin:0;">Aquí tienes tus herramientas de automatización. ¡Aprende a tu ritmo!</p>
    </section>

    <div id="loader">Conectando con la academia...</div>
    <div class="course-grid" id="courseGrid"></div>
  </div>
 
 

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyLOXOGA8rMYKyxGrYPNtDo7ZFUlUeQjDRAgrfhSJk2p44pzzHdtx-ZQ9U7JW0bd5wJvQ/exec";

    const userEmail = localStorage.getItem('userEmail');
    const userToken = localStorage.getItem('userToken');

    if (!userEmail || !userToken) {
        window.location.href = "index.html";
    } else {
        cargarDashboard();
    }

    async function cargarDashboard() {
        const loader = document.getElementById('loader');
        const welcome = document.getElementById('welcomeText');
        try {
            const response = await fetch(`${WEB_APP_URL}?action=getDashboard&email=${userEmail}&token=${userToken}`);
            const data = await response.json();
            
            if (data.status === "success") {
                loader.style.display = 'none';
                const nombre = data.nombre || localStorage.getItem('userName') || 'Emprendedor';
                welcome.innerText = "¡Bienvenido, " + nombre + "!";
                
               // 🚀 PERSONALIZACIÓN DINÁMICA DEL MENSAJE
            const msg = `Hola Hugo! Soy ${nombre} (${userEmail}), vengo desde mi Panel de Cursos y me gustaría consultarte por una asesoría personalizada`;
            const finalUrl = `https://wa.me/5491136151754?text=${encodeURIComponent(msg)}`;
            
            // ✅ ACTUALIZAMOS ÚNICAMENTE EL BANNER (Quitamos la línea de 'waLink')
            document.getElementById('consultoriaBtn').href = finalUrl;
            
            renderizarCursos(data.cursos);
            } else {
                cerrarSesion();
            }
        } catch (e) {
            loader.innerText = "Error de conexión. Reintenta en unos momentos.";
        }
    }

    function renderizarCursos(cursos) {
        const grid = document.getElementById('courseGrid');
        grid.innerHTML = cursos && cursos.length > 0 
            ? cursos.map(curso => `
                <div class="course-card">
                    <img src="${curso.urlBanner || 'https://via.placeholder.com/400x160?text=Curso+Pro'}" class="course-card-image">
                    <div class="course-card-content">
                        <h3>${curso.nombre}</h3>
                        <p>${curso.descripcion || 'Sin descripción disponible.'}</p>
                        <button class="course-card-button" onclick="irAlCurso('${curso.id}')">Acceder al Curso</button>
                    </div>
                </div>`).join('')
            : '<p style="color:white; grid-column: 1/-1; text-align:center;">No tienes cursos asignados aún.</p>';
    }

    function irAlCurso(id) {
        localStorage.setItem('cursoActual', id);
        window.location.href = "curso.html";
    }

    function cerrarSesion() {
        localStorage.clear();
        window.location.href = "index.html";
    }
</script>
</body>
